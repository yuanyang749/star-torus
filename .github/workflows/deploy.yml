name: Deploy Multi-Project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Multi-Directory Site
        run: |
          mkdir -p _site
          # 1. 根目录部署 star-torus
          cp -r star-torus/* _site/
          # 2. 子目录部署 feature-cards
          mkdir -p _site/feature-cards
          cp -r feature-cards/* _site/feature-cards/
          # 3. 添加 .nojekyll 防止静态文件被过滤
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
